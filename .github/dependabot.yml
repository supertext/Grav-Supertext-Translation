version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 13 needs PHP 8.4; the plugin supports PHP 8.3 (CI tests 8.3).
      - dependency-name: "phpunit/phpunit"
        versions: [">=13"]
      # Symfony 8 needs PHP 8.4; the plugin supports PHP 8.3 (CI tests 8.3).
      - dependency-name: "symfony/yaml"
        versions: [">=8"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/scripts/movie"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
